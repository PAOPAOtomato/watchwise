# Watchwise configuration reference.
#
# You normally don't write this by hand: `watchwise init` generates
# config/watchwise.yml from a hardware profile (see `watchwise profiles`).
# This file documents every section. ${VAR:-default} values are read from the
# environment / .env; WATCHWISE_* variables override individual settings
# (see watchwise/config.py).

# Tier 1: the NVR. Watchwise only reads Frigate's HTTP API and MQTT.
nvr:
  # Port 5000 is Frigate's internal API. From the compose network:
  # http://frigate:5000. From the host: http://localhost:5000.
  base_url: ${FRIGATE_URL:-http://localhost:5000}
  # Frigate's web page as your phone reaches it, e.g. over Tailscale
  # (https://<machine>.<tailnet>.ts.net:8971). Alert cards then get a link to
  # each alert's recording; the link passes through Telegram. Empty: no link.
  web_url: ${FRIGATE_WEB_URL:-}
  timeout_s: 10.0

mqtt:
  enabled: true
  host: ${MQTT_HOST:-localhost}
  port: 1883
  topic_prefix: frigate # must match Frigate's mqtt.topic_prefix
  client_id: watchwise
  # Screen an event when it starts (new) and look again when it ends (end);
  # the end costs a model call only if it shows a new label or zone.
  screen_on: [new, end]

# Model endpoints, by name. provider is one of:
#   stub           deterministic stand-in: no model, no cost (tests, demos)
#   ollama         a local Ollama server (native API, sets the context length)
#   openai_compat  any OpenAI-compatible server: OpenAI, Groq, Gemini,
#                  OpenRouter, LM Studio, llama.cpp, vLLM, OpenVINO MS
#   anthropic      Claude via the Anthropic SDK (pip install "watchwise[anthropic]")
# api_key_env names a variable in .env; keys never go in this file.
models:
  local:
    provider: ollama
    base_url: ${OLLAMA_URL:-http://localhost:11434}
    model: qwen3-vl:4b
    context_window: 8192 # Ollama num_ctx; too small silently truncates prompts
    max_tokens: 1024 # output cap, thinking included; also the screener's cap
    timeout_s: 300
    keep_alive: 30m
  # cloud:
  #   provider: anthropic
  #   model: claude-opus-5-5
  #   api_key_env: ANTHROPIC_API_KEY
  #   effort: medium          # low | medium | high | xhigh | max
  #   refusal_fallback: true  # server-side retry of declined requests
  # cloud:
  #   provider: openai_compat
  #   base_url: https://api.openai.com/v1
  #   model: gpt-5-mini
  #   api_key_env: OPENAI_API_KEY

# Which endpoint does which job.
roles:
  screener: local # tier 2: looks at frames, says benign / suspicious / uncertain
  investigator: local # tier 3: tool-calling agent for the hard cases
  chat: local # conversation (Ask Watchwise)
  # chat_escalation: cloud

# Tier-2 tuning. The model, and its output cap (max_tokens), come from
# roles.screener.
vlm:
  frames: 2 # frames sampled per alert
  max_image_edge: 640
  jpeg_quality: 70
  timeout_s: 60
  max_concurrency: 2 # so N cameras cannot stampede one GPU
  # max_tokens: 1024  # only to override the screener model's own max_tokens;
  #                   # thinking models need about 1000 before they answer

# Tier-3 investigation.
agent:
  # auto: the tool-calling loop on roles.investigator when it is a real model,
  # otherwise the deterministic scripted loop. Also: scripted, tools, claude_sdk.
  backend: auto
  max_iterations: 6
  stop_confidence: 0.85
  timeout_s: 180
  max_concurrency: 2
  queue_size: 128
  # claude_sdk backend only:
  model: claude-opus-5-5
  effort: medium
  max_budget_usd: 0.50

# The free, model-free filter in front of everything. Most of the cost saving
# comes from here.
gate:
  enabled: true
  dedupe_window_s: 60
  min_object_score: 0.0
  always_alert_labels: [] # e.g. [fire, smoke]
  never_screen_labels: [] # e.g. [cat, dog]
  memory_suppress_similarity: 0.86
  memory_min_corrections: 3

# Getting verdicts to people and other systems.
notify:
  # Phone alerts with buttons that teach the memory. `watchwise telegram link`
  # fills in chat_ids. Telegram relays card text, and the snapshot unless
  # send_images is false.
  telegram:
    enabled: false
    bot_token_env: WATCHWISE_TELEGRAM_BOT_TOKEN # names the variable in .env
    chat_ids: [] # only these chats receive alerts or may press buttons
    send_images: true
    notify_on: [alerted, escalated_human] # also possible: downgraded, suppressed
    snooze_minutes: 60
    # After 🚨 Real, ask "What was wrong?". The reply becomes the example the
    # models are shown for that kind of event (it leaves the machine only if a
    # model role uses a cloud provider).
    ask_why_on_real: true
  # Publish every verdict on watchwise/verdicts and watchwise/<camera>/verdict.
  mqtt:
    enabled: false
    topic_prefix: watchwise
  # POST every verdict as JSON to this URL.
  webhook_url: null
  # Every day, a Telegram message saying how many events were held back and
  # why, with a few of them sent back as cards to spot-check (✅ / 🚨 like any
  # card). It goes through Telegram like the cards; /digest sends one now.
  digest:
    enabled: true
    at: "08:00" # local time
    spot_checks: 2 # 0 turns them off
    silent: true # no sound or vibration

memory:
  db_path: ./data/watchwise.db
  embedding_backend: hash
  embedding_dim: 256
  short_term_max_items: 40
  short_term_max_chars: 12000
  pattern_half_life_days: 30

# The risk posture of the whole system, in five numbers.
decision:
  screen_benign_confidence: 0.80
  screen_suspicious_confidence: 0.80
  human_fallback_confidence: 0.60
  auto_downgrade_confidence: 0.85
  always_surface_suspicious: true
  # How long the first card may wait for the vision model before it goes out
  # as "Analyzing..." (edited with the verdict later); null = always wait.
  provisional_after_s: 10
  provisional_after_armed_s: 0 # while armed away or at night

duty_roster:
  path: ./config/duty_roster.yml
  timezone: UTC

# People who live here, as Frigate's face recognition names them (it must be
# enabled in Frigate; see deploy/frigate/config.example.yml). While at home or
# disarmed, a recognized resident is held back, even after a card went out;
# while armed, they count like a duty-roster match. A face Frigate saw but
# could not match to anyone raises the event when it ends. Recognition runs in
# Frigate on this machine; a recognized name appears in card text (Telegram).
faces:
  household: [] # e.g. [alex]
  alert_on_unknown: true
  min_unknown_attempts: 2

# The rest of what /setup in Telegram asks; it writes these blocks (and
# faces.household) after you confirm, backs up this file first, and the
# running service uses them at once. Safe to edit by hand.
# What each camera looks at, in your words. The notes go into the model
# prompts: with a cloud model, they are sent to its provider.
# room: cameras in one room share one card per incident, a tap on it teaches
# all of them, and an investigation reads them as one view, not as movement.
cameras: {} # e.g. {webcam: {notes: "my bedroom workspace; I sit at the desk most days", room: bedroom}}
rooms:
  # Two cameras' events in one room are one incident when they overlap in
  # time, or one starts within this many seconds of the other's end.
  merge_window_s: 30
  # A card takes a room's events for at most this long after its first one;
  # later events, and events that would otherwise go unnoticed on it (more
  # serious than the card, or after you answered it), get a card of their own.
  max_incident_s: 300
# What should always alert, even at home. The vision model checks every event
# for these (sent to its provider, with a cloud model); a match alerts at once
# and can only raise an event, never lower one. A resident Frigate recognizes
# at home is held back before these are checked, unless the rule says "anyone"
# or "any person": then it is asked about them too, once, when the event ends.
alerts:
  always: [] # e.g. ["anyone at the window"]
# Assumed while no arming state is set (/arm in Telegram, or POST /arming).
arming:
  default: armed_away # armed_away | armed_night | armed_home | disarmed

service:
  host: 127.0.0.1
  port: 5055
  log_level: INFO
  # Load the local models at start-up and keep the screener loaded while the
  # service runs, so no alert waits for a model to be read from disk.
  warm_up_models: true
