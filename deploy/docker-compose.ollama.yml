# Overlay: run local models in an Ollama container (CPU by default; the
# nvidia/amd overlays add GPU access). Not used on macOS, where Ollama must
# run natively to use the GPU -- see docker-compose.apple.yml.

services:
  ollama:
    # Pin a version tag for reproducible installs.
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      # Default context for callers that do not set one (e.g. Frigate's own
      # GenAI requests). Watchwise always sets num_ctx itself.
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_KEEP_ALIVE: "30m"

volumes:
  ollama-models:
