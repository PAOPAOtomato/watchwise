# Minimal Frigate config for use with Watchwise.
# `watchwise init --deploy` copies this to deploy/frigate/config.yml once;
# edit that copy. Full reference: https://docs.frigate.video/configuration/reference

mqtt:
  enabled: true
  host: mqtt
  topic_prefix: frigate # Watchwise's mqtt.topic_prefix must match

# Object detection. OpenVINO on CPU works on any x86-64 machine (Intel or AMD).
# Intel iGPU: device GPU. Intel Core Ultra: device NPU (with the intel overlay).
# NVIDIA, AMD, Apple Silicon: see https://docs.frigate.video/configuration/object_detectors
detectors:
  ov:
    type: openvino
    device: CPU

model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

record:
  enabled: true
  motion:
    days: 3

# Optional: Frigate's own GenAI summary of each finished alert, written from
# several frames of the whole event. Watchwise adds it to its cards ("What
# happened"), and a suspicious or critical rating raises an event Watchwise had
# downgraded or held back (it never lowers one). Use the same Ollama server and
# model as Watchwise's screener, with the same context length (num_ctx), or
# Ollama reloads the model whenever the two take turns. Frigate replaces its
# default options when you set `options`, so they are repeated here.
# Caveat: Frigate sends about one frame per second of the event and budgets
# frames with a generic token estimate. qwen3-vl on Ollama spends far more
# tokens per frame than that, so with an 8192 context only events of a few
# seconds fit; longer ones fail (Frigate logs a warning, the card keeps
# Watchwise's own reason).
# genai:
#   local:
#     provider: ollama
#     base_url: http://ollama:11434
#     model: qwen3-vl:8b-instruct
#     roles: [descriptions]
#     provider_options:
#       options: {num_ctx: 8192, temperature: 0.5, repeat_penalty: 1.05, presence_penalty: 0.3}
# review:
#   genai:
#     enabled: true
#     additional_concerns:
#       - Unusual or erratic behaviour or gestures by a person

# Optional: Frigate's face recognition, so Watchwise can hold back the people
# who live here and raise a face nobody matches (list their names under
# `faces.household` in Watchwise's config, exactly as in Frigate's Face
# Library). It runs locally; the small model runs on the CPU, after a one-time
# model download. Add faces in Frigate's web UI: Face Library > Add Face (1-5
# clear, front-facing photos), then train from the faces it shows you.
# face_recognition:
#   enabled: true
#   model_size: small

cameras:
  front_door: # one block per camera; rename freely
    enabled: false # set to true once the stream URL below is real
    ffmpeg:
      inputs:
        - path: rtsp://user:password@192.168.1.10:554/stream1
          roles: [detect, record]
    detect:
      enabled: true # Frigate leaves object detection off unless enabled
      width: 1280
      height: 720
      fps: 5
