# Overlay: Apple Silicon. Docker on macOS cannot use the GPU, so Ollama runs
# natively (install the Ollama app) and the containers reach it on the host.

services:
  frigate:
    image: ${FRIGATE_IMAGE:-ghcr.io/blakeblackshear/frigate:stable-standard-arm64}

  sentinel:
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
