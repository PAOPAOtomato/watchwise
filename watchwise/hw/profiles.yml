# Hardware profiles: which models run where.
#
# `watchwise doctor` picks one from what it detects; `watchwise init` writes it
# into config/watchwise.yml, where every value can be edited by hand.
#
# Model choices here are STARTING POINTS, not measurements. `watchwise check`
# measures what your machine actually does with them. Local tags are Ollama
# library names; one vision+tools model (qwen3-vl) serves every local role on
# small machines so only one model has to stay loaded.
#
# A model's max_tokens is also the screener's output cap. The default qwen3-vl
# tags think before they answer (400-700 tokens measured on qwen3-vl:8b), so
# keep it at 1024 or more; a smaller cap returns no verdict at all.
version: 1

# Profiles tried in this order when choosing automatically. The first whose
# `when` matches wins. `demo` and `cloud` are only used when asked for.
auto_order:
  - nvidia-16gb
  - nvidia
  - apple-silicon
  - apple-silicon-8gb
  - amd-rocm
  - cpu-hybrid
  - cpu-local

# Cloud providers, in preference order. A profile role written as "@cloud"
# is filled from the chosen provider. Each provider is detected by the first of
# its `env` variables that is set: the WATCHWISE_ one is a key just for this
# project and wins over the provider's usual variable, which other tools on
# the machine may share. The generated config names whichever one was found.
cloud_providers:
  anthropic:
    env: [WATCHWISE_ANTHROPIC_API_KEY, ANTHROPIC_API_KEY]
    label: Anthropic (Claude)
    endpoint:
      provider: anthropic
      model: claude-opus-5-5
      max_tokens: 16000
      timeout_s: 180
    # Per-role tuning: chat answers fast at low effort; investigation is
    # multi-step tool use and gets the default depth.
    role_overrides:
      screener: {effort: low}
      investigator: {effort: medium}
      chat: {effort: low}
  openai:
    env: [WATCHWISE_OPENAI_API_KEY, OPENAI_API_KEY]
    label: OpenAI
    endpoint:
      provider: openai_compat
      base_url: https://api.openai.com/v1
      model: gpt-5-mini
      max_tokens: 4096
      timeout_s: 120
    # Same idea as for Claude: chat answers fast at low reasoning effort.
    role_overrides:
      screener: {effort: low}
      investigator: {effort: medium}
      chat: {effort: low}
    verify_model: true
  gemini:
    env: [WATCHWISE_GEMINI_API_KEY, GEMINI_API_KEY]
    label: Google Gemini (OpenAI-compatible endpoint)
    endpoint:
      provider: openai_compat
      base_url: https://generativelanguage.googleapis.com/v1beta/openai
      model: gemini-2.5-flash
      max_tokens: 4096
      timeout_s: 120
    verify_model: true
  groq:
    env: [WATCHWISE_GROQ_API_KEY, GROQ_API_KEY]
    label: Groq
    endpoint:
      provider: openai_compat
      base_url: https://api.groq.com/openai/v1
      model: openai/gpt-oss-120b
      max_tokens: 4096
      timeout_s: 60
    verify_model: true
  openrouter:
    env: [WATCHWISE_OPENROUTER_API_KEY, OPENROUTER_API_KEY]
    label: OpenRouter
    endpoint:
      provider: openai_compat
      base_url: https://openrouter.ai/api/v1
      model: openrouter/auto
      max_tokens: 4096
      timeout_s: 120
    verify_model: true

profiles:
  demo:
    title: Demo (no models, no cameras)
    summary: >-
      Simulated models and, with `watchwise demo`, a simulated NVR. Runs
      anywhere in seconds. Proves the wiring, not the judgement.
    models:
      stub: {provider: stub, model: stub}
    roles: {screener: stub, investigator: stub, chat: stub}
    agent_backend: scripted
    tuning:
      vlm: {frames: 2}
    compose: []
    leaves_machine: nothing

  cpu-local:
    title: CPU only, everything local
    summary: >-
      No usable GPU. Every model runs on this machine: fully private, but
      slow. Screening takes tens of seconds per alert and chat replies are
      sluggish.
    when: {accelerator: none}
    models:
      local:
        provider: ollama
        base_url: ${OLLAMA_URL:-http://localhost:11434}
        model: qwen3-vl:4b
        context_window: 8192
        max_tokens: 1024
        timeout_s: 600
        keep_alive: 30m
    roles: {screener: local, investigator: local, chat: local}
    tuning:
      vlm: {frames: 1, max_image_edge: 448, max_concurrency: 1, timeout_s: 180}
      agent: {max_concurrency: 1, max_iterations: 4, timeout_s: 900}
    compose: [ollama]
    leaves_machine: nothing
    notes:
      - Frigate detector on Intel/AMD CPUs: OpenVINO (device CPU, or GPU/NPU on Intel).
      - With a cloud API key in .env, the cpu-hybrid profile keeps frames local and makes chat fast.

  cpu-hybrid:
    title: CPU only + your cloud model (recommended without a GPU)
    summary: >-
      Frames never leave this machine: a small local vision model screens
      them. Investigation and chat use your cloud model, so conversation is
      fast. Only text (detector metadata, tool results, descriptions) is sent.
    when: {accelerator: none, cloud_key: true}
    models:
      local:
        provider: ollama
        base_url: ${OLLAMA_URL:-http://localhost:11434}
        model: qwen3-vl:2b
        context_window: 4096
        max_tokens: 1024
        timeout_s: 300
        keep_alive: 30m
    roles: {screener: local, investigator: "@cloud", chat: "@cloud"}
    tuning:
      vlm: {frames: 1, max_image_edge: 448, max_concurrency: 1, timeout_s: 120}
      agent: {max_concurrency: 2, timeout_s: 300}
    compose: [ollama]
    leaves_machine: text to your cloud provider (no images)

  nvidia:
    title: NVIDIA GPU (8-15 GB)
    summary: >-
      Everything local on the GPU with one vision+tools model, so nothing
      has to be swapped in and out of VRAM.
    when: {accelerator: nvidia, min_accelerator_gb: 7}
    models:
      local:
        provider: ollama
        base_url: ${OLLAMA_URL:-http://localhost:11434}
        model: qwen3-vl:8b
        context_window: 8192
        max_tokens: 1024
        timeout_s: 120
        keep_alive: 30m
    roles: {screener: local, investigator: local, chat: local}
    tuning:
      vlm: {frames: 2, max_image_edge: 640, max_concurrency: 2, timeout_s: 60}
    compose: [ollama, nvidia]
    leaves_machine: nothing
    notes:
      - Frigate detector: TensorRT/ONNX (stable-tensorrt image). Frigate shares the GPU with Ollama.
      - If you see out-of-memory errors or very slow replies, switch the model to qwen3-vl:4b.

  nvidia-16gb:
    title: NVIDIA GPU (16 GB+)
    summary: >-
      A vision model for screening plus a larger reasoning model for
      investigation and chat, both resident on the GPU.
    when: {accelerator: nvidia, min_accelerator_gb: 15}
    models:
      vision:
        provider: ollama
        base_url: ${OLLAMA_URL:-http://localhost:11434}
        model: qwen3-vl:8b
        context_window: 8192
        max_tokens: 1024
        timeout_s: 120
        keep_alive: 30m
      reasoning:
        provider: ollama
        base_url: ${OLLAMA_URL:-http://localhost:11434}
        model: qwen3:14b
        context_window: 16384
        max_tokens: 2048
        timeout_s: 180
        keep_alive: 30m
    roles: {screener: vision, investigator: reasoning, chat: reasoning}
    tuning:
      vlm: {frames: 2, max_image_edge: 640, max_concurrency: 2, timeout_s: 60}
    compose: [ollama, nvidia]
    leaves_machine: nothing

  apple-silicon:
    title: Apple Silicon (16 GB+ unified memory)
    summary: >-
      Everything local, accelerated by Metal. Ollama runs natively on macOS
      because Docker containers on a Mac cannot use the GPU.
    when: {accelerator: apple, min_accelerator_gb: 15}
    models:
      local:
        provider: ollama
        base_url: ${OLLAMA_URL:-http://localhost:11434}
        model: qwen3-vl:8b
        context_window: 8192
        max_tokens: 1024
        timeout_s: 120
        keep_alive: 30m
    roles: {screener: local, investigator: local, chat: local}
    tuning:
      vlm: {frames: 2, max_image_edge: 640, max_concurrency: 1, timeout_s: 90}
    compose: [apple]
    leaves_machine: nothing
    notes:
      - Install the Ollama app natively; containers reach it at host.docker.internal:11434.
      - Frigate detector: the Apple Silicon detector client (runs natively, outside Docker).

  apple-silicon-8gb:
    title: Apple Silicon (8 GB)
    summary: >-
      A smaller local model to fit in 8 GB of unified memory. Consider
      cpu-hybrid-style cloud chat if replies feel slow.
    when: {accelerator: apple}
    models:
      local:
        provider: ollama
        base_url: ${OLLAMA_URL:-http://localhost:11434}
        model: qwen3-vl:4b
        context_window: 4096
        max_tokens: 1024
        timeout_s: 180
        keep_alive: 30m
    roles: {screener: local, investigator: local, chat: local}
    tuning:
      vlm: {frames: 1, max_image_edge: 448, max_concurrency: 1, timeout_s: 120}
    compose: [apple]
    leaves_machine: nothing

  amd-rocm:
    title: AMD GPU (ROCm)
    summary: Everything local on the GPU via Ollama's ROCm build.
    when: {accelerator: amd}
    models:
      local:
        provider: ollama
        base_url: ${OLLAMA_URL:-http://localhost:11434}
        model: qwen3-vl:8b
        context_window: 8192
        max_tokens: 1024
        timeout_s: 120
        keep_alive: 30m
    roles: {screener: local, investigator: local, chat: local}
    tuning:
      vlm: {frames: 2, max_image_edge: 640, max_concurrency: 2, timeout_s: 60}
    compose: [ollama, amd]
    leaves_machine: nothing
    notes:
      - Frigate detector: ROCm/ONNX (stable-rocm image).

  cloud:
    title: Cloud only (no local models)
    summary: >-
      Fastest to set up and nothing to install, but frames are sent to your
      cloud provider for screening.
    models: {}
    roles: {screener: "@cloud", investigator: "@cloud", chat: "@cloud"}
    tuning:
      vlm: {frames: 2, max_image_edge: 768, max_concurrency: 2, timeout_s: 60}
    compose: []
    leaves_machine: images and text to your cloud provider
